<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo oscuro, redondeado -->
  <rect width="512" height="512" rx="100" fill="#0a0b10"/>
  <!-- Borde dorado fino -->
  <rect x="6" y="6" width="500" height="500" rx="96"
        fill="none" stroke="#d4af37" stroke-width="10" opacity="0.5"/>
  <!-- Las dos letras por separado, con espacio entre ellas
       para que a tamaño chico se distingan como dos formas -->
  <text x="150" y="262"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="300" fill="#d4af37"
        text-anchor="middle" dominant-baseline="central">L</text>
  <text x="352" y="262"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="300" fill="#d4af37"
        text-anchor="middle" dominant-baseline="central">A</text>
</svg>
